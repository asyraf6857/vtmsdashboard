<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>VTMS Dashboard</title><style>body{margin:0;background:#071626;color:#e8f5ff;font:15px system-ui}header{padding:26px 5%;background:#102b46;border-bottom:1px solid #31516a}h1{margin:0}main{padding:24px 5%}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.card{padding:22px;background:#12304a;border-radius:14px}.value{font-size:30px;font-weight:750;color:#59d4ee}select{padding:9px;margin:8px;background:#163650;color:white;border:1px solid #567}canvas{width:100%;max-height:380px}.panel{background:#102b46;padding:20px;border-radius:14px;margin-top:20px}small{color:#99b9ca}</style></head><body><header><h1>⚓ Vessel Traffic Monitoring Dashboard</h1><small>Port of Tanjung Pelepas · Historical vessel traffic analytics</small></header><main><label>Year <select id="year"><option>2026</option><option>2025</option></select></label><div class="cards"><div class="card">Annual / YTD Vessel Calls<div class="value" id="total">—</div></div><div class="card">Latest Month<div class="value" id="latest">—</div></div><div class="card">Average per Month<div class="value" id="avg">—</div></div></div><div class="panel"><h2>Monthly Vessel Calls</h2><canvas id="chart" width="1000" height="360"></canvas></div><div class="panel"><h2>Monthly Breakdown</h2><div id="rows"></div></div><small>Source: VOR 2025 and January–September 2026. Historical records, not live AIS.</small></main><script>let db;const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];fetch('./data.json').then(r=>r.json()).then(d=>{db=d;render()}).catch(()=>document.getElementById('rows').textContent='Unable to load data.json');document.getElementById('year').onchange=render;function render(){if(!db)return;let y=document.getElementById('year').value, raw=db[y]||db.years?.[y]||{}, arr=Array.isArray(raw)?raw:raw.monthly||raw.months||[];let vals=arr.map(v=>typeof v==='number'?v:Number(v.calls??v.ship_calls??v.total??0));let total=vals.reduce((a,b)=>a+b,0);document.getElementById('total').textContent=total.toLocaleString();document.getElementById('latest').textContent=(vals.at(-1)||0).toLocaleString();document.getElementById('avg').textContent=vals.length?Math.round(total/vals.length).toLocaleString():'—';document.getElementById('rows').innerHTML=vals.map((v,i)=>'<p>'+months[i]+': '+v.toLocaleString()+'</p>').join('');const c=document.getElementById('chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);let mx=Math.max(...vals,1);vals.forEach((v,i)=>{let w=700/Math.max(vals.length,1),h=v/mx*280,x=70+i*w;ctx.fillStyle='#2cc6dc';ctx.fillRect(x,310-h,w*.65,h);ctx.fillStyle='#e8f5ff';ctx.font='15px system-ui';ctx.fillText(months[i],x,338);ctx.fillText(String(v),x,300-h)})}</script></body></html>
