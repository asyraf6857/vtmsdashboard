<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:15px system-ui;background:#081524;color:#e7f2fc;margin:0;padding:28px}main{max-width:600px;margin:40px auto;background:#10273d;padding:30px;border:1px solid #34536a;border-radius:18px}h1{font-size:24px}p{color:#adc3d5}input{display:block;width:100%;box-sizing:border-box;padding:18px;border:1px dashed #6b8aa1;border-radius:10px;color:#fff;background:#173751;margin:20px 0}button{background:#30b8cc;border:0;border-radius:10px;padding:13px 20px;color:#06202d;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{white-space:pre-wrap;margin-top:18px}small{color:#aac0d1}</style></head><body><main><h1>⚓ VTMS — Upload VOR Excel</h1><p>Authorized users only. Upload the original VOR Excel workbook to update monthly statistics in Google Sheets.</p><form id="upload"><input name="vorFile" id="vorFile" type="file" accept=".xlsx" required><input type="hidden" name="originalFileName" id="originalFileName"><button id="send" type="submit">Upload &amp; Import VOR</button></form><p id="status" role="status"></p><small>Maximum 10 MB · .xlsx only · Existing year records are replaced, not duplicated. Keep a backup before importing.</small></main><script>document.getElementById('upload').addEventListener('submit',function(e){e.preventDefault();const f=document.getElementById('vorFile').files[0],s=document.getElementById('status'),b=document.getElementById('send');if(!f||!f.name.toLowerCase().endsWith('.xlsx')){s.textContent='Choose a valid .xlsx file';return}if(f.size>10*1024*1024){s.textContent='File exceeds 10 MB';return}document.getElementById('originalFileName').value=f.name;b.disabled=true;s.textContent='Uploading and validating...';google.script.run.withSuccessHandler(function(msg){s.textContent='✓ '+msg;b.disabled=false}).withFailureHandler(function(err){s.textContent='Import failed: '+err.message;b.disabled=false}).importUploadedForm(document.getElementById('upload'))});</script></body></html>
