<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:15px system-ui;background:#0c2032;color:#e7f5ff;padding:28px;max-width:620px;margin:auto}h2{margin-bottom:8px}p{color:#a8c5d8}form{background:#17324a;border:1px solid #365b74;padding:24px;border-radius:15px}input,button{padding:13px;width:100%;margin:10px 0;box-sizing:border-box}button{background:#45d4e4;color:#071927;border:0;border-radius:8px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#result{white-space:pre-wrap;margin-top:18px;line-height:1.5}</style></head><body><h2>⚓ Upload Movement Planning</h2><p>Authorized VTMS users only. Upload a single-year .xlsx report. Only rows with Assign Pilot count as movements. The imported year's monthly summary will be replaced.</p><form id="f"><input type="file" id="file" name="movementFile" accept=".xlsx" required><input type="hidden" name="originalFileName" id="originalFileName"><button id="submit" type="submit">Upload & Update Movement Summary</button></form><div id="result"></div><script>document.getElementById('f').onsubmit=function(e){e.preventDefault();const file=document.getElementById('file').files[0];if(!file)return;document.getElementById('originalFileName').value=file.name;const btn=document.getElementById('submit');btn.disabled=true;document.getElementById('result').textContent='Processing Excel file…';google.script.run.withSuccessHandler(msg=>{btn.disabled=false;document.getElementById('result').textContent='✓ '+msg+'\nRefresh the Movement Dashboard to see updated statistics.'}).withFailureHandler(err=>{btn.disabled=false;document.getElementById('result').textContent='Error: '+err.message}).importMovementUploadedForm(this)};</script></body></html>
